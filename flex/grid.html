<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .grid {
  display: grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows: repeat(3,1fr);
  gap: 10px;
  height: 500px;
}

.box1{
  padding: 20px;
  border: 1px solid black;
  grid-row: 1/3;
  grid-column: 1/3;
  background-color: lightblue;
  display: flex;
  justify-content: center;
  align-items: center;

}
.box2{
    border: 1px solid black;
    grid-column: 3/4;
    background-color: lightcoral;
    display: flex;
  justify-content: center;
  align-items: center;

}
.box3{
    border: 1px solid black;
    grid-column: 4/5;
    background-color: lightcyan;
    display: flex;
  justify-content: center;
  align-items: center;
}

.box4{
    border: 1px solid black;
    grid-column: 3/4;
    background-color: lightgoldenrodyellow;
    display: flex;
  justify-content: center;
  align-items: center;
}
.box5{
     border: 1px solid black;
    grid-column: 4/5;
    background-color: lightgreen;
    display: flex;
  justify-content: center;
  align-items: center;
}


/* Box 1 takes 1/3 width */

.boxfull{
    grid-column: 1/-1;
    border: 1px solid black;
    background-color: lightskyblue;
    display: flex;
  justify-content: center;
  align-items: center;
}


/* Last box covers full width */
.full {
  grid-column: 1 / -1;
}
    </style>
</head>
<body>
<div class="grid">
  <div class="box1">Box 1</div>
  <div class="box2">Box 2</div>
  <div class="box3">Box 3</div>
  <div class="box4">Box 4</div>
  <div class="box5">Box 5</div>
  <div class="boxfull">Box 6</div>
</div>
</body>
</html>
