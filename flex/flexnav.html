<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
        }

        .container{
            background-color: lightslategrey;
            height: 40px;
            width: 100%;
            display: flex;
            align-items: center;  
            border: 2px solid black;
            justify-content: space-evenly;

        }
       
        
        .picture{
            height: 30px;
            width: 30px;
            background-color: brown;
            border-radius: 50px;
            margin-left: 20px;
        }
        ul{
            list-style: none;
            display: flex;
            justify-content: space-between;
            height: 30px;
            width: 33%;
            
        }
        
        .search{
            
            height: 39px;
            width: 34%;
            display: flex;
            align-items: center;
            justify-content: space-evenly;

            

        }
        .sb{
           border: 2px solid black;
            height: 30px;
            width: 60%;
            border-radius: 10px;
            
        }
        .searchsymbol{
            height: 30px;
            width: 13%;
            border: 2px solid black;
            border-radius: 50px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="picture"></div>
        <ul class="navlist">
            <li>Home</li>
            <li>about</li>
            <li>contactus</li>
        </ul>
        <div class="search">
            <div class="sb"></div>
            <div class="searchsymbol"></div>
        </div>
        
    </div>
    
</body>
</html>
