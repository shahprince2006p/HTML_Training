<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Complete HTML Form</title>

</head>

<body>

  <form action="#" method="post">

    <fieldset>
      <legend>Personal Information</legend>

      <!-- Text Input -->
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name"><br><br>

      <!-- Email -->
      <label for="email">Email</label>
      <input type="email" id="email" name="email"><br><br>

      <!-- Password -->
      <label for="password">Password</label>
      <input type="password" id="password" name="password"><br><br>

      <!-- Number -->
      <label for="age">Age</label>
      <input type="number" id="age" name="age"><br><br>

      <!-- Date -->
      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob"><br><br>

      <!-- Phone -->
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone"><br><br>

      <!-- URL -->
      <label for="website">Website</label>
      <input type="url" id="website" name="website"><br><br>

      <!-- Search -->
      <label for="search">Search</label>
      <input type="search" id="search" name="search"><br><br>

      <!-- Color -->
      <label for="color">Favorite Color</label>
      <input type="color" id="color" name="color"><br><br>

      <!-- Range -->
      <label for="range">Satisfaction Level</label>
      <input type="range" id="range" name="range" min="0" max="10"><br><br>

      <!-- Time -->
      <label for="time">Preferred Time</label>
      <input type="time" id="time" name="time"><br><br>

      <!-- Month -->
      <label for="month">Birth Month</label>
      <input type="month" id="month" name="month"><br><br>

      <!-- Week -->
      <label for="week">Select Week</label>
      <input type="week" id="week" name="week"><br><br>

    </fieldset>

    <fieldset>
      <legend>Gender</legend>

      <!-- Radio Buttons -->
      <div class="radio-group">
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label><br><br></b>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label><br><br>
      </div>

    </fieldset>

    <fieldset>
      <legend>Skills</legend>

      <!-- Checkboxes -->
      <div class="checkbox-group">
        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label><br><br>

        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label><br><br>

        <input type="checkbox" id="js" name="skills" value="JavaScript">
        <label for="js">JavaScript</label><br><br>
      </div>

    </fieldset>

    <fieldset>
      <legend>Other Inputs</legend>

      <!-- Select Dropdown -->
      <label for="city">Select City</label>
      <select id="city" name="city">
        <option value="">--Choose City--</option>
        <option value="Vadodara">Vadodara</option>
        <option value="Ahmedabad">Ahmedabad</option>
        <option value="Surat">Surat</option>
      </select>

      <!-- Textarea -->
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5"></textarea>

      <!-- File Upload -->
      <label for="file">Upload File</label>
      <input type="file" id="file" name="file">

      <!-- Hidden Input -->
      <input type="hidden" name="userid" value="101">

    </fieldset>

    <!-- Buttons -->
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

  </form>

</body>
</html>
